name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href of the published site (use "/" for a custom domain)'
        required: false
        default: '/sdrfedit/'

# The published site is a preview of the editor. The copy embedded in
# https://sdrf.quantms.org is served from dist/ over jsDelivr instead
# (see build-dist.yml).
env:
  BASE_HREF: ${{ github.event.inputs.base_href || '/sdrfedit/' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is intentionally gitignored, so npm ci and
      # setup-node's built-in cache (both need a lockfile) are not usable.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm install --no-audit --no-fund

      - name: Build
        run: npx ng build --configuration production --base-href "$BASE_HREF"

      - name: Add SPA fallback
        run: cp dist/sdrf-editor/browser/index.html dist/sdrf-editor/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sdrf-editor/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
